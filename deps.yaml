# Dependency rules of the repository root. This file is the source: Makefile.dep
# next to it is generated from it (`just generate-config-data`).
# Format: dist/tools/config_data/README.md
schema: 1
rules:
  - comment: include board specific application dependencies
    include: {path: '${APPDIR}/Makefile.board.dep', optional: true}
  - include: {path: '${APPDIR}/Makefile.${TOOLCHAIN}.dep', optional: true}
  - comment: include board dependencies
    include: {path: '${BOARDDIR}/Makefile.dep', optional: true}
  - comment: include cpu dependencies
    include: {path: '${RIOTCPU}/${CPU}/Makefile.dep', optional: true}
  - comment: |-
      include external modules dependencies
      processed before RIOT ones to be evaluated before the 'default' rules.
    include: {for_each: EXTERNAL_MODULE_PATHS, path: '%Makefile.dep', optional: true}
  - comment: pull dependencies from sys, drivers, (common) boards and (common) cpus
    include: {path: '${RIOTBASE}/sys/Makefile.dep'}
  - include: {path: '${RIOTBASE}/drivers/Makefile.dep'}
  - include: {path: '${RIOTBASE}/boards/Makefile.dep'}
  - include: {path: '${RIOTCPU}/Makefile.dep'}
  - comment: pull Makefile.dep of each driver modules if they exist
    include: {for_each: USEMODULE, path: '${RIOTBASE}/drivers/%/Makefile.dep', sort: true, optional: true}
  - comment: pull Makefile.dep of each sys modules if they exist
    include: {for_each: USEMODULE, path: '${RIOTBASE}/sys/%/Makefile.dep', sort: true, optional: true}
  - comment: pull dependencies from packages
    include: {for_each: PKG_PATHS, path: '%Makefile.dep', optional: true}
  - if: {has: {var: USEMODULE, match: [mpu_stack_guard]}}
    then:
      - add: {FEATURES_REQUIRED: [cortexm_mpu]}
  - if: {has: {var: USEMODULE, match: [mpu_noexec_ram]}}
    then:
      - add: {FEATURES_REQUIRED: [cortexm_mpu]}
  - if: {has: {var: USEMODULE, match: [pmp_noexec_ram]}}
    then:
      - add: {FEATURES_REQUIRED: [periph_pmp]}
  - if: {has: {var: USEMODULE, match: [lwip_%]}}
    then:
      - add: {USEPKG: [lwip]}
  - if: {has: {var: USEMODULE, match: [libfixmath-unittests]}}
    then:
      - add: {USEPKG: [libfixmath]}
      - add: {USEMODULE: [libfixmath]}
  - if: {has: {var: USEMODULE, match: [spiffs]}}
    then:
      - add: {USEPKG: [spiffs]}
      - add: {USEMODULE: [vfs, spiffs_fs, mtd]}
  - if: {has: {var: USEMODULE, match: [littlefs]}}
    then:
      - add: {USEPKG: [littlefs]}
      - add: {USEMODULE: [vfs, littlefs_fs, mtd]}
  - if: {has: {var: USEMODULE, match: [littlefs2]}}
    then:
      - add: {USEPKG: [littlefs2]}
      - add: {USEMODULE: [vfs, littlefs2_fs, mtd]}
  - if: {has: {var: USEMODULE, match: [fatfs_vfs]}}
    then:
      - add: {USEPKG: [fatfs]}
      - add: {USEMODULE: [vfs]}
  - if: {has: {var: USEMODULE, match: [lwext%_vfs]}}
    then:
      - add: {USEPKG: [lwext4]}
      - add: {USEMODULE: [vfs]}
  - if: {has: {var: USEMODULE, match: [xipfs]}}
    then:
      - add: {USEPKG: [xipfs]}
      - add: {USEMODULE: [vfs, xipfs_fs]}
  - if: {has: {var: USEMODULE, match: [nimble_%]}}
    then:
      - add: {USEPKG: [nimble]}
  - if: {has: {var: USEMODULE, match: [tlsf-malloc]}}
    then:
      - add: {USEPKG: [tlsf]}
  - if: {has: {var: USEMODULE, match: [tinydtls_sock_dtls]}}
    then:
      - add: {USEPKG: [tinydtls]}
  - if: {has: {var: USEMODULE, match: [flashdb_%]}}
    then:
      - add: {USEPKG: [flashdb]}
  - if: {has: {var: USEMODULE, match: [tinyusb_%]}}
    then:
      - add: {USEPKG: [tinyusb]}
  - comment: always select gpio (until explicit dependencies are sorted out)
    add: {FEATURES_OPTIONAL: [periph_gpio]}
  - comment: |-
      always select power management unless building the bootloader
      pm is not needed by the bootloader and omitting it saves some ROM
    if: {not: {equals: {RIOTBOOT_BUILD: '1'}}}
    then:
      - add: {FEATURES_OPTIONAL: [periph_pm]}
  - comment: don't use idle thread if architecture has needed support
    add: {FEATURES_OPTIONAL: [no_idle_thread]}
  - if: {has: {var: FEATURES_USED, match: [libstdcpp]}}
    then:
      - comment: Also use C++ if libstdc++ is used
        add: {USEMODULE: [cpp]}
      - add: {USEMODULE: [libstdcpp]}
  - if: {has: {var: FEATURES_USED, match: [cpp]}}
    then:
      - comment: Also use C++ if libstdc++ is used
        add: {USEMODULE: [cpp]}
  - if: {has: {var: USEMODULE, match: [test_utils_interactive_sync]}}
    then:
      - if: {has: {var: USEMODULE, match: [shell]}}
        then:
          - add: {DEFAULT_MODULE: [test_utils_interactive_sync_shell]}
