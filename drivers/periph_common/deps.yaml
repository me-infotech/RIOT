# Dependency rules of drivers/periph_common (authoritative; Makefile.dep is generated from this file).
schema_version: 1
rules:
- comment: Always use hardware features, if available
  add:
    FEATURES_OPTIONAL: [periph_gpio_ll_disconnect]
- add:
    FEATURES_OPTIONAL: [periph_gpio_ll_input_pull_down, periph_gpio_ll_input_pull_keep, periph_gpio_ll_input_pull_up,
      periph_gpio_ll_irq_edge_triggered_both, periph_gpio_ll_irq_level_triggered_high, periph_gpio_ll_irq_level_triggered_low,
      periph_gpio_ll_irq_unmask, periph_gpio_ll_open_drain, periph_gpio_ll_open_drain_pull_up, periph_gpio_ll_open_source,
      periph_gpio_ll_open_source_pull_down, periph_gpio_ll_switch_dir]
