# Dependency rules of drivers/netdev_ieee802154_submac (authoritative; Makefile.dep is generated from this file).
schema_version: 1
rules:
- add:
    USEMODULE: [netdev_ieee802154, netdev_new_api, ieee802154, ieee802154_submac, iolist, ztimer_usec]
- when:
    USEMODULE:
      any: [netdev_ieee802154_submac_soft_ack]
  then:
  - add:
      USEMODULE: [ieee802154_submac_soft_ack]
  - message: {level: warning, text: SubMAC Soft ACK has been renamed to ieee802154_submac_soft_ack. Will
        be removed after release 2027.04}
