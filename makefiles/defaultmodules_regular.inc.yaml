# Rules of the build system (defaultmodules_regular) in makefiles. This file is the source: defaultmodules_regular.inc.mk
# next to it is generated from it (`just generate-config-data`).
# Format: dist/tools/config_data/README.md
schema: 1
rules:
  - comment: |-
      This file declares DEFAULT_MODULEs that MAY have dependencies themselves
      and whose dependencies MAY have dependencies as well.
      These DEFAULT_MODULEs MUST only be disabled at application level or
      in BOARD/CPU Makefile.default.
  - add: {DEFAULT_MODULE: [board, board_common_init, cpu, core, core_init, core_lib, core_msg, core_panic,
        core_thread, sys, libc]}
  - comment: Include potentially added default modules by the board
    include: {path: '${BOARDDIR}/Makefile.default', optional: true}
  - comment: Include potentially added default modules by the CPU
    include: {path: '${RIOTCPU}/${CPU}/Makefile.default', optional: true}
