# Build data of makefiles/bindist.inc.mk (steps G3-1, G0-3): the directories
# of the binary modules. The generated bindist.build.mk holds it as Make;
# bindist.inc.mk includes it and keeps the module list and the bindist
# targets. Building from a binary distribution (Makefile.distcheck) is not
# data: the build without Make stops at that include.
# Format: dist/tools/config_data/README.md
schema: 3
rules:
  - set: {var: BUILD_DISTCHECK, value: {files: {match: [Makefile.distcheck]}}}
  - comment: |-
      if the file Makefile.distcheck exists, we're executing from within a folder
      generated by "make bindist".
    if: {nonempty: [BUILD_DISTCHECK]}
    then:
      - include: {path: Makefile.distcheck}
    else:
      - add: {DIRS: ['${BIN_DIRS}']}
