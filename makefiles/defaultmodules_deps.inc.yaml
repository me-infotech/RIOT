# Rules of the build system (defaultmodules_deps) in makefiles. This file is the source: defaultmodules_deps.inc.mk
# next to it is generated from it (`just generate-config-data`).
# Format: dist/tools/config_data/README.md
schema: 1
rules:
  - comment: |-
      This files contains dependencies for default modules. They are parsed at the
      end of the dependency loop. They MAY include new modules, but these modules
      MUST NOT have dependencies themselves.
  - if: {has: {var: USEMODULE, match: [auto_init%]}}
    then:
      - add: {USEMODULE: [preprocessor, preprocessor_successor]}
  - if: {has: {var: USEMODULE, match: [auto_init_ztimer]}}
    then:
      - add: {USEMODULE: [ztimer_init]}
  - if: {has: {var: USEMODULE, match: [ztimer_auto_adjust]}}
    then:
      - add: {USEMODULE: [ztimer_overhead]}
  - if: {has: {var: USEMODULE, match: [auto_init_saul]}}
    then:
      - add: {USEMODULE: [saul_init_devs]}
  - if: {has: {var: USEMODULE, match: [auto_init_libcose_crypt]}}
    then:
      - add: {USEMODULE: [libcose_crypt_init]}
  - if: {has: {var: USEMODULE, match: [random]}}
    then:
      - comment: select default prng if no prng is selected
        if: {not: {has: {var: USEMODULE, match: [prng_%]}}}
        then:
          - add: {USEMODULE: [prng_musl_lcg]}
  - if: {has: {var: USEMODULE, match: [xtimer]}}
    then:
      - if: {not: {has: {var: USEMODULE, match: [ztimer_xtimer_compat]}}}
        then:
          - add: {USEMODULE: [div]}
