# Rules of the build system (features_modules) in makefiles. This file is the source: features_modules.inc.mk
# next to it is generated from it (`just generate-config-data`).
# Format: dist/tools/config_data/README.md
schema: 2
rules:
  - comment: |-
      Add modules implementing used features

      This is done after the regular dependency resolution in Makefile.dep, as
      feature resolution depends on the used modules. As these modules however have
      no dependencies(except for periph_common), no dependency resolution is needed.
  - set:
      var: PERIPH_FEATURES
      value: {select: {var: FEATURES_USED, match: [periph_%]}}
      flavor: simple
  - comment: |-
      all periph features correspond to a periph submodule
      FEATURES_USED is defined in Makefile.features
    add: {USEMODULE: ['${PERIPH_FEATURES}']}
  - comment: Add all USED periph_% init modules unless they are blacklisted
    set: {var: PERIPH_IGNORE_MODULES, value: periph_cipher_aes_128_cbc periph_cipher_chacha20 periph_aead_aes_128_ccm
        periph_clic periph_common periph_coretimer periph_cryptocell_310 periph_ecc_p192r1 periph_ecc_p256r1
        periph_ecc_ed25519 periph_eth periph_eth_common periph_flash periph_flashpage_in_address_space
        periph_flexcomm periph_gpio_ll% periph_gpio_mux periph_hash_sha_1 periph_hash_sha3_256 periph_hash_sha3_384
        periph_hash_sha3_512 periph_hash_sha_224 periph_hash_sha_256 periph_hash_sha_384 periph_hash_sha_512
        periph_hash_sha_512_224 periph_hash_sha_512_256 periph_hmac_sha_256 periph_i2c_hw periph_i2c_sw
        periph_init% periph_mcg periph_mcg_lite periph_nvm periph_plic periph_rtc_ms periph_rtc_rtt periph_rtt_hw_rtc
        periph_rtt_hw_sys periph_spi_on_qspi periph_timer_poll periph_timer_query_freqs periph_uart_collision
        periph_uart_rxstart_irq periph_wdog periph_wdt_auto_start periph_xh3irq, flavor: simple}
  - set:
      var: PERIPH_MODULES
      value: {select: {var: USEMODULE, match: [periph_%], except: ['${PERIPH_IGNORE_MODULES}']}}
      flavor: simple
  - comment: Use simple expansion to avoid USEMODULE referencing itself
    set:
      var: PERIPH_INIT_MODULES
      value: {select: {var: PERIPH_MODULES, replace: {from: periph_, to: periph_init_}}}
      flavor: simple
  - add: {DEFAULT_MODULE: ['${PERIPH_INIT_MODULES}']}
  - comment: select cpu_check_address pseudomodule if the corresponding feature is used
    add: {USEMODULE: [{select: {var: FEATURES_USED, match: [cpu_check_address]}}]}
  - comment: select can_rx_mailbox pseudomodule if the corresponding feature is used
    add: {USEMODULE: [{select: {var: FEATURES_USED, match: [can_rx_mailbox]}}]}
  - comment: select bootloader_stm32 module if the feature is used
    add: {USEMODULE: [{select: {var: FEATURES_USED, match: [bootloader_stm32]}}]}
  - comment: include puf_sram if used
    add: {USEMODULE: [{select: {var: FEATURES_USED, match: [puf_sram]}}]}
  - comment: include periph_common if any periph_* driver is used
    if: {has: {var: USEMODULE, match: [periph_%]}}
    then:
      - add: {USEMODULE: [periph_common]}
  - comment: include rtc_utils if periph_rtc is used
    if: {has: {var: USEMODULE, match: [periph_rtc]}}
    then:
      - add: {USEMODULE: [rtc_utils]}
  - comment: |-
      select cortexm_stack_limit pseudomodule if the corresponding
      feature is used
    add: {USEMODULE: [{select: {var: FEATURES_USED, match: [cortexm_stack_limit]}}]}
  - comment: select cortexm_svc pseudomodule if the corresponding feature is used
    add: {USEMODULE: [{select: {var: FEATURES_USED, match: [cortexm_svc]}}]}
  - comment: select core_idle_thread if the feature no_idle_thread is *not* used
    if: {not: {has: {var: FEATURES_USED, match: [no_idle_thread]}}}
    then:
      - if: {has: {var: USEMODULE, match: [core_thread]}}
        then:
          - add: {USEMODULE: [core_idle_thread]}
  - comment: use mpu_stack_guard if the feature is used
    if: {has: {var: FEATURES_USED, match: [cortexm_mpu]}}
    then:
      - add: {USEMODULE: [mpu_stack_guard]}
  - comment: use picolibc if the feature is used
    if: {has: {var: FEATURES_USED, match: [picolibc]}}
    then:
      - add: {USEMODULE: [picolibc]}
  - comment: use newlib if the feature is used
    if: {has: {var: FEATURES_USED, match: [newlib]}}
    then:
      - add: {USEMODULE: [newlib]}
  - comment: use efm32_coretemp if the feature is used
    add: {USEMODULE: [{select: {var: FEATURES_USED, match: [efm32_coretemp]}}]}
  - comment: use efm32_eth if the feature is used
    add: {USEMODULE: [{select: {var: FEATURES_USED, match: [efm32_eth]}}]}
  - comment: use lpc1768_eth if the feature is used
    add: {USEMODULE: [{select: {var: FEATURES_USED, match: [lpc1768_eth]}}]}
  - comment: if LC filter(s) is attached to the CPUs voltage regulator, use it
    add: {USEMODULE: [{select: {var: FEATURES_USED, match: [vdd_lc_filter_%]}}]}
  - comment: select arduino_pwm pseudomodule if the corresponding feature is used
    add: {USEMODULE: [{select: {var: FEATURES_USED, match: [arduino_pwm]}}]}
  - comment: |-
      always register a peripheral driver as a required feature when the corresponding
      module is requested
    add: {PERIPH_IGNORE_MODULES: [periph_usbdev_clk, periph_gpio_mock, periph_gpio_linux, periph_i2c_mock,
        periph_spidev_linux]}
  - if: {has: {var: DEFAULT_MODULE, match: [periph_%]}}
    then:
      - add: {FEATURES_REQUIRED: [{select: {var: USEMODULE, match: [periph_%], except: ['${PERIPH_IGNORE_MODULES}']}}]}
