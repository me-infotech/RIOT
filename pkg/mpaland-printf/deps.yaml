# Dependency rules of pkg/mpaland-printf. This file is the source: Makefile.dep
# next to it is generated from it (`just generate-config-data`).
# Format: dist/tools/config_data/README.md
schema: 1
rules:
  - comment: |-
      mpaland's printf does not implement non-standard format specifiers. For
      AVR MCUs we do need the ability to print from PROGMEM, though. Hence, this
      is not compatible with AVR MCUs.
    add: {FEATURES_BLACKLIST: [arch_avr8]}
  - comment: |-
      On ESP it is not easily possible to replace newlib's stdio, as there is only
      API compatibility and not ABI compatibility between mpaland-printf and newlib's
      printf and the ESP SDK contains binary blobs.
    add: {FEATURES_BLACKLIST: [arch_esp]}
  - comment: On 64 bit systems, we depend on long long support to be able to support `%p`
    if: {has: {var: FEATURES_USED, match: [arch_64bit]}}
    then:
      - add: {USEMODULE: [printf_long_long]}
