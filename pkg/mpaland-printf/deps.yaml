# Dependency rules of pkg/mpaland-printf (authoritative; Makefile.dep is generated from this file).
schema_version: 1
rules:
- comment: 'mpaland''s printf does not implement non-standard format specifiers. For

    AVR MCUs we do need the ability to print from PROGMEM, though. Hence, this

    is not compatible with AVR MCUs.'
  add:
    FEATURES_BLACKLIST: [arch_avr8]
- comment: 'On ESP it is not easily possible to replace newlib''s stdio, as there is only

    API compatibility and not ABI compatibility between mpaland-printf and newlib''s

    printf and the ESP SDK contains binary blobs.'
  add:
    FEATURES_BLACKLIST: [arch_esp]
- comment: On 64 bit systems, we depend on long long support to be able to support `%p`
  when:
    FEATURES_USED:
      any: [arch_64bit]
  then:
  - add:
      USEMODULE: [printf_long_long]
