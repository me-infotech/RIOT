# Package data of pkg/mpaland-printf/Makefile (steps G3-1, G0-3): name, URL,
# version. The generated pkg.mk holds them as Make; the Makefile includes it
# and keeps the rule that builds the module (the build without Make reads
# the PKG_BUILD_MODULE_* stand-ins for it).
# Format: dist/tools/config_data/README.md
schema: 4
rules:
  - set: {var: PKG_NAME, value: mpaland-printf}
  - set: {var: PKG_URL, value: 'https://github.com/mpaland/printf'}
  - comment: 4.0.0
    set: {var: PKG_VERSION, value: 0dd4b64bc778bf55229428cefccba4c0a81f384b}
  - set: {var: PKG_LICENSE, value: MIT}
  - include: {path: '${RIOTBASE}/pkg/pkg.mk'}
  - comment: 'Makefile: the rule that builds the module file mpaland-printf.mk in the source directory'
    set: {var: PKG_BUILD_MODULE_DIR, value: '${PKG_SOURCE_DIR}'}
    stand_in: pkg/mpaland-printf/Makefile
  - set: {var: PKG_BUILD_MODULE_FILE, value: '${RIOTPKG}/${PKG_NAME}/${PKG_NAME}.mk'}
    stand_in: pkg/mpaland-printf/Makefile
