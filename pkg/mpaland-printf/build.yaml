# Build data of pkg/mpaland-printf/Makefile.include (steps G3-1, G0-3): the whole file.
# pkg/mpaland-printf/Makefile.include is generated from it (`just generate-config-data`);
# edit this file, never the Make file. Format: dist/tools/config_data/README.md
schema: 1
rules:
  - comment: |-
      wrap stdio functions to use mpaland's printf instead of the one from the
      standard C lib
    add: {LINKFLAGS: ['-Wl,-wrap=printf']}
  - add: {LINKFLAGS: ['-Wl,-wrap=fprintf', '-Wl,-wrap=dprintf', '-Wl,-wrap=sprintf', '-Wl,-wrap=snprintf',
        '-Wl,-wrap=vprintf', '-Wl,-wrap=vfprintf', '-Wl,-wrap=vdprintf', '-Wl,-wrap=vsprintf', '-Wl,-wrap=vsnprintf',
        '-Wl,-wrap=putchar', '-Wl,-wrap=putc', '-Wl,-wrap=fputc', '-Wl,-wrap=puts', '-Wl,-wrap=fputs']}
  - comment: |-
      By wrapping the newlib only `_printf_common` symbol to the undefined
      `__wrap__printf_common` symbol, linking will fail if any reference to
      `_printf_common` remains. Since `_printf_common` is only used by newlib's
      stdio, we will catch any instance of both mpaland-printf and newlib's stdio
      being both linked in.
    add: {LINKFLAGS: ['-Wl,-wrap=_printf_common']}
  - add: {LINKFLAGS: ['-Wl,-wrap=_fprintf_r', '-Wl,-wrap=_printf_r', '-Wl,-wrap=iprintf', '-Wl,-wrap=fiprintf']}
  - comment: |-
      Workaround for bug in the newlib headers shipped with e.g. Ubuntu 24.04 LTS
      not defining PRId64 / PRIu64 / PRIx64 / PRIo64 in <inttypes.h> due to an issue
      in <machine/_default_types.h>. Tested to cause no regression on fixed newlib
      headers.
    if: {has: {var: FEATURES_USED, match: [newlib]}}
    then:
      - add: {CFLAGS: [-D__int64_t_defined=1]}
