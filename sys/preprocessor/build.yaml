# Build data of sys/preprocessor/Makefile.include (steps G3-1, G0-3): its
# variables. The generated build.mk holds them as Make; Makefile.include
# includes it and keeps the rule that writes the header (a build step:
# BUILD_HEADERS stands for it, dist/tools/cmake_gen/plan.py).
# Format: dist/tools/config_data/README.md
schema: 4
rules:
  - set: {var: RIOT_PP_SUCCESSOR_MAX, value: '9999', flavor: conditional}
  - add: {PSEUDOMODULES: [preprocessor_successor]}
  - set: {var: USEMODULE_INCLUDES_preprocessor, value: '${BINDIR}/preprocessor', flavor: simple}
  - add: {USEMODULE_INCLUDES: ['${USEMODULE_INCLUDES_preprocessor}']}
  - set: {var: RIOT_GENERATE_PP_HEADERS, value: '', flavor: simple}
  - if: {has: {var: USEMODULE, match: [preprocessor_successor]}}
    then:
      - add: {RIOT_GENERATE_PP_HEADERS: ['${BINDIR}/preprocessor/preprocessor_successor.h']}
  - comment: 'Makefile.include: BUILDDEPS += $(RIOT_GENERATE_PP_HEADERS) and the rule'
    add: {BUILD_HEADERS: ['${RIOT_GENERATE_PP_HEADERS}']}
    stand_in: sys/preprocessor/Makefile.include
