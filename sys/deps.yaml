      any: [newlib_gnu_source]
  then:
  - add:
      FEATURES_REQUIRED: [newlib]
- when:
    USEMODULE:
      any: [newlib_nano]
  then:
  - add:
      FEATURES_REQUIRED: [newlib]
- when:
    USEMODULE:
      any: [newlib]
  then:
  - comment: 'allow custom newlib syscalls implementations by adding

      newlib_syscalls_XXX to USEMODULE'
    when:
      USEMODULE:
        none: [newlib_syscalls_%]
    then:
    - add:
        USEMODULE: [newlib_syscalls_default]
  - when:
      USEMODULE:
        any: [newlib_syscalls_default]
    then:
    - add:
        USEMODULE: [div]
    - when:
        USEMODULE:
          any: [libc_gettimeofday]
      then:
      - add:
          USEMODULE: [xtimer]
      - when:
          USEMODULE:
            any: [ztimer_xtimer_compat]
        then:
        - comment: requires 64bit timestamps
          add:
            USEMODULE: [ztimer64_xtimer_compat]
  - when:
      FEATURES_USED:
        any: [bug_newlib_broken_stdio]
    then:
    - comment: 'work around broken newlib stdio by using alternative stdio implementation,

        unless stdio_null is used, which is inherently thread-safe :)'
      when:
        USEMODULE:
          none: [stdio_null]
      then:
      - add:
          USEPKG: [mpaland-printf]
- when:
