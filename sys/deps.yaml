# Dependency rules of sys (authoritative; Makefile.dep is generated from this file).
schema_version: 1
rules:
- comment: cannot be moved to GNRC's Makefile.dep, as module name neither starts or ends with gnrc
  when:
    USEMODULE:
      any: [auto_init_gnrc_netif]
  then:
  - add:
      USEMODULE: [gnrc_netif_init_devs]
- when:
    USEMODULE:
      any: [auto_init_wdt_thread]
  then:
  - add:
      USEMODULE: [periph_wdt_auto_start, ztimer_msec]
  - comment: we can only have either auto_init_wdt_event or auto_init_wdt_thread
    when:
      USEMODULE:
        any: [auto_init_wdt_event]
    then:
    - message: {level: error, text: auto_init_wdt_event and auto_init_wdt_thread are mutually exclusive}
- when:
    USEMODULE:
      any: [auto_init_wdt_event]
  then:
  - add:
      USEMODULE: [event_periodic_callback, event_thread, periph_wdt_auto_start, ztimer_msec]
- when:
    USEMODULE:
      any: [auto_init_sock_dns]
  then:
  - when:
      USEMODULE:
        any: [ipv4]
    then:
    - add:
        USEMODULE: [ipv4_addr]
  - when:
      USEMODULE:
        any: [ipv6]
    then:
    - add:
        USEMODULE: [ipv6_addr]
- when:
    USEMODULE:
      any: [congure_%]
  then:
  - add:
      USEMODULE: [congure]
- when:
    USEMODULE:
      any: [crc16_fast]
  then:
  - add:
      USEMODULE: [checksum]
- when:
    USEMODULE:
      any: [crc32_fast]
  then:
  - add:
      USEMODULE: [checksum]
- when:
    USEMODULE:
      any: [cpp]
  then:
  - add:
      USEMODULE: [cpp_new_delete]
- when:
    USEMODULE:
      any: [debug_irq_disable]
  then:
  - add:
      USEMODULE: [fmt]
- when:
    USEMODULE:
      any: [fmt_table]
  then:
  - add:
      USEMODULE: [fmt]
- when:
    USEMODULE:
      any: [prng_fortuna]
  then:
  - add:
      USEMODULE: [crypto_aes_128]
- when:
    USEMODULE:
      any: [crypto_%]
  then:
  - add:
      USEMODULE: [crypto]
- when:
    USEMODULE:
      any: [cipher_modes]
  then:
  - add:
      USEMODULE: [crypto]
- when:
