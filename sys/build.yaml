# Build data of sys/Makefile.include (step G3-1): flags, include paths and
# pseudomodules of the system modules, in the order of the Make file. The
# Make files it includes are read as their build data; one that is not
# converted yet stops the build without Make (outside the data) when its
# module is used.
# Format: dist/tools/config_data/README.md (schema 3).
schema: 3
rules:
  - if: {has: {var: USEMODULE, match: [bhp]}}
    then:
      - include: {path: '${RIOTBASE}/sys/bhp/Makefile.include'}
  - if: {has: {var: USEMODULE, match: [gnrc_sixlowpan_frag_rb]}}
    then:
      - add: {USEMODULE_INCLUDES: ['${RIOTBASE}/sys/net/gnrc/network_layer/sixlowpan/frag']}
  - if: {has: {var: USEMODULE, match: [gnrc_lorawan]}}
    then:
      - add: {USEMODULE_INCLUDES: ['${RIOTBASE}/sys/net/gnrc/link_layer/lorawan/include']}
  - if: {has: {var: USEMODULE, match: [gnrc_sock]}}
    then:
      - add: {USEMODULE_INCLUDES: ['${RIOTBASE}/sys/net/gnrc/sock/include']}
  - if: {has: {var: USEMODULE, match: [gnrc_sock_async]}}
    then:
      - add: {CFLAGS: [-DSOCK_HAS_ASYNC]}
  - if: {has: {var: USEMODULE, match: [gnrc_pktbuf]}}
    then:
      - include: {path: '${RIOTBASE}/sys/net/gnrc/pktbuf/Makefile.include'}
  - if: {has: {var: USEMODULE, match: [gnrc_pktbuf_static]}}
    then:
      - include: {path: '${RIOTBASE}/sys/net/gnrc/pktbuf_static/Makefile.include'}
  - if: {has: {var: USEMODULE, match: [malloc_thread_safe]}}
    then:
      - include: {path: '${RIOTBASE}/sys/malloc_thread_safe/Makefile.include'}
  - if: {has: {var: USEMODULE, match: [posix_headers]}}
    then:
      - add: {USEMODULE_INCLUDES: ['${RIOTBASE}/sys/posix/include']}
  - if: {has: {var: USEMODULE, match: [pthread]}}
    then:
      - add: {USEMODULE_INCLUDES: ['${RIOTBASE}/sys/posix/pthread/include']}
  - if: {has: {var: USEMODULE, match: [oneway_malloc]}}
    then:
      - add: {USEMODULE_INCLUDES: ['${RIOTBASE}/sys/oneway-malloc/include']}
  - if: {has: {var: USEMODULE, match: [eui_provider]}}
    then:
      - add: {USEMODULE_INCLUDES: ['${RIOTBASE}/sys/net/link_layer/eui_provider/include']}
  - comment: '`ifdef APP_SHELL_FMT`: a non-empty APP_SHELL_FMT'
    if: {has: {var: USEMODULE, match: [app_metadata]}}
    then:
      - if: {nonempty: [APP_SHELL_FMT]}
        then:
          - add: {CFLAGS: ['-DAPP_SHELL_FMT=\"${APP_SHELL_FMT}\"']}
  - if: {has: {var: USEMODULE, match: [auto_init]}}
    then:
      - add: {USEMODULE_INCLUDES: ['${RIOTBASE}/sys/auto_init/include']}
  - if: {has: {var: USEMODULE, match: [cpp11-compat]}}
    then:
      - add: {USEMODULE_INCLUDES: ['${RIOTBASE}/sys/cpp11-compat/include']}
  - if: {has: {var: USEMODULE, match: [embunit]}}
    then:
      - if: {equals: {OUTPUT: XML}}
        then:
          - add: {CFLAGS: [-DOUTPUT=OUTPUT_XML]}
        elif:
          - if: {equals: {OUTPUT: TEXT}}
            then:
              - add: {CFLAGS: [-DOUTPUT=OUTPUT_TEXT]}
          - if: {equals: {OUTPUT: COMPILER}}
            then:
              - add: {CFLAGS: [-DOUTPUT=OUTPUT_COMPILER]}
          - if: {equals: {OUTPUT: COLORTEXT}}
            then:
              - add: {CFLAGS: [-DOUTPUT=OUTPUT_COLORTEXT]}
          - if: {equals: {OUTPUT: COLOR}}
            then:
              - add: {CFLAGS: [-DOUTPUT=OUTPUT_COLOR]}
  - if: {has: {var: USEMODULE, match: [log_color]}}
    then:
      - include: {path: '${RIOTBASE}/sys/log_color/Makefile.include'}
  - if: {has: {var: USEMODULE, match: [log_printfnoformat]}}
    then:
      - include: {path: '${RIOTBASE}/sys/log_printfnoformat/Makefile.include'}
  - if: {has: {var: USEMODULE, match: [newlib]}}
    then:
      - include: {path: '${RIOTMAKE}/libc/newlib.mk'}
  - if: {has: {var: USEMODULE, match: [picolibc]}}
    then:
      - include: {path: '${RIOTMAKE}/libc/picolibc.mk'}
  - if: {has: {var: USEMODULE, match: [arduino]}}
    then:
      - include: {path: '${RIOTBASE}/sys/arduino/Makefile.include'}
  - if: {has: {var: USEMODULE, match: [printf_float]}}
    then:
      - if: {has: {var: USEMODULE, match: [newlib_nano]}}
        then:
          - if: {not: {has: {var: USEPKG, match: [mpaland-printf]}}}
            then:
              - add: {LINKFLAGS: [-u _printf_float]}
  - if: {has: {var: USEMODULE, match: [scanf_float]}}
    then:
      - if: {has: {var: USEMODULE, match: [newlib_nano]}}
        then:
          - add: {LINKFLAGS: [-u _scanf_float]}
  - include: {path: '${RIOTBASE}/sys/slot_aux/Makefile.include'}
  - if: {has: {var: FEATURES_USED, match: [riotboot]}}
    then:
      - include: {path: '${RIOTBASE}/sys/riotboot/Makefile.include'}
  - if: {has: {var: USEMODULE, match: [skald]}}
    then:
      - include: {path: '${RIOTBASE}/sys/net/ble/skald/Makefile.include'}
  - if: {has: {var: USEMODULE, match: [sock, sock_%]}}
    then:
      - if: {has: {var: USEMODULE, match: [ipv4]}}
        then:
          - add: {CFLAGS: [-DSOCK_HAS_IPV4]}
      - if: {has: {var: USEMODULE, match: [ipv6]}}
        then:
          - add: {CFLAGS: [-DSOCK_HAS_IPV6]}
  - if: {has: {var: USEMODULE, match: [sock_async_event]}}
    then:
      - include: {path: '${RIOTBASE}/sys/net/sock/async/event/Makefile.include'}
  - if: {has: {var: USEMODULE, match: [ssp]}}
    then:
      - include: {path: '${RIOTBASE}/sys/ssp/Makefile.include'}
  - if: {not: {equals: {CPU: native}}}
    then:
      - add: {INCLUDES: ['-I${RIOTBASE}/sys/libc/include']}
  - if: {has: {var: USEMODULE, match: [clif]}}
    then:
      - add: {INCLUDES: ['-I${RIOTBASE}/sys/clif/include']}
  - if: {has: {var: USEMODULE, match: [zptr]}}
    then:
      - include: {path: '${RIOTBASE}/sys/zptr/Makefile.include'}
  - if: {has: {var: USEMODULE, match: [test_utils_result_output]}}
    then:
      - include: {path: '${RIOTBASE}/sys/test_utils/result_output/Makefile.include'}
  - if: {has: {var: USEMODULE, match: [test_utils_netdev_ieee802154_minimal]}}
    then:
      - add: {CFLAGS: [-DCONFIG_NETDEV_REGISTER_SIGNAL]}
  - if: {has: {var: USEMODULE, match: [ztimer]}}
    then:
      - include: {path: '${RIOTBASE}/sys/ztimer/Makefile.include'}
  - if: {has: {var: USEMODULE, match: [prng]}}
    then:
      - include: {path: '${RIOTBASE}/sys/random/Makefile.include'}
  - if: {has: {var: USEMODULE, match: [psa_crypto]}}
    then:
      - include: {path: '${RIOTBASE}/sys/psa_crypto/Makefile.include'}
  - if: {has: {var: USEMODULE, match: [test_utils_netdev_eth_minimal]}}
    then:
      - add: {CFLAGS: [-DCONFIG_NETDEV_REGISTER_SIGNAL]}
  - if: {has: {var: USEMODULE, match: [shell_lock]}}
    then:
      - include: {path: '${RIOTBASE}/sys/shell_lock/Makefile.include'}
  - add: {PSEUDOMODULES: [shell_democommands]}
  - if: {has: {var: USEMODULE, match: [rust_riotmodules]}}
    then:
      - include: {path: '${RIOTBASE}/sys/rust_riotmodules/Makefile.include'}
  - if: {has: {var: USEMODULE, match: [tiny_strerror]}}
    then:
      - include: {path: '${RIOTBASE}/sys/tiny_strerror/Makefile.include'}
  - if: {has: {var: USEMODULE, match: [preprocessor_%]}}
    then:
      - include: {path: '${RIOTBASE}/sys/preprocessor/Makefile.include'}
  - if: {has: {var: USEMODULE, match: [gcoap]}}
    then:
      - include: {path: '${RIOTBASE}/sys/net/application_layer/gcoap/Makefile.include'}
  - if: {has: {var: USEMODULE, match: [nanocoap]}}
    then:
      - include: {path: '${RIOTBASE}/sys/net/application_layer/nanocoap/Makefile.include'}
  - if: {has: {var: USEMODULE, match: [unicoap]}}
    then:
      - include: {path: '${RIOTBASE}/sys/net/application_layer/unicoap/Makefile.include'}
  - if: {has: {var: USEMODULE, match: [event]}}
    then:
      - include: {path: '${RIOTBASE}/sys/event/Makefile.include'}
