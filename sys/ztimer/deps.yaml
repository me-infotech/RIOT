# Dependency rules of sys/ztimer (authoritative; Makefile.dep is generated from this file).
schema_version: 1
rules:
- comment: '

    ztimer dependencies


    "ztimer" is the default meta-module of ztimer'
  when:
    USEMODULE:
      any: [ztimer]
  then:
  - add:
      USEMODULE: [ztimer_core, ztimer_convert_frac, ztimer_convert_shift]
  - add:
      DEFAULT_MODULE: [auto_init_ztimer, ztimer_init]
- when:
    USEMODULE:
      any: [ztimer_xtimer_compat]
  then:
  - add:
      USEMODULE: [ztimer_usec]
- when:
    USEMODULE:
      any: [ztimer64_xtimer_compat]
  then:
  - add:
      USEMODULE: [ztimer64_usec, ztimer_xtimer_compat]
- when:
    USEMODULE:
      any: [ztimer_%]
  then:
  - add:
      USEMODULE: [ztimer_core, ztimer_extend]
- when:
    USEMODULE:
      any: [ztimer_ondemand_%]
  then:
  - add:
      USEMODULE: [ztimer_ondemand]
- when:
    USEMODULE:
      any: [ztimer_convert_%]
  then:
  - add:
      USEMODULE: [ztimer_convert]
- when:
    USEMODULE:
      any: [ztimer_periph_lptimer]
  then:
  - add:
      USEMODULE: [ztimer_periph_timer]
- when:
    USEMODULE:
      any: [ztimer_periph_timer]
  then:
  - add:
      FEATURES_REQUIRED: [periph_timer]
  - add:
      FEATURES_OPTIONAL: [periph_timer_query_freqs]
- when:
    USEMODULE:
      any: [ztimer_periph_rtc]
  then:
  - add:
      FEATURES_REQUIRED: [periph_rtc]
- when:
    USEMODULE:
      any: [ztimer_periph_rtt]
  then:
  - add:
      FEATURES_REQUIRED: [periph_rtt]
- when:
    USEMODULE:
      any: [ztimer_periph_ptp]
  then:
  - add:
      FEATURES_REQUIRED: [periph_ptp_timer]
- when:
    USEMODULE:
      any: [ztimer_convert_frac]
  then:
  - add:
      USEMODULE: [frac]
- when:
    USEMODULE:
      any: [ztimer_usec]
  then:
  - add:
      USEMODULE: [ztimer, ztimer_periph_timer]
- comment: 'NOTE: select the module here and not in the CPU so that order of inclusion

    does not have periph_rtt selected earlier that it should be while at the same

    time avoiding the module ''ztimer-no_periph_rtt'' being included unecesarily.

    The samd21 rtt busy loops for 180us every time an alarm is set or

    the counter is read, this propagates and leads to timing errors

    on ztimer_msec that are higher than > +-1msec.

    The same goes for the fe310 rtt.'
  when:
    CPU:
      any: [samd21, fe310]
  then:
  - add:
      USEMODULE: [ztimer_no_periph_rtt]
- when:
    USEMODULE:
      any: [ztimer_msec, ztimer_sec]
  then:
  - add:
      USEMODULE: [ztimer]
  - when:
      USEMODULE:
        none: [ztimer_no_periph_rtt]
    then:
    - add:
        FEATURES_OPTIONAL: [periph_rtt]
    - comment: 'HACK: periph_rtt will get used only in the next iteration but an updated

        state for FEATURES_USED is needed here so include `features_check.inc.mk`

        here instead.

        An other option would be to check FEATURES_PROVIDED this would avoid the

        order of inclusion problem but it would no take into account possible conflicts

        and is also currently not allowed in the build system.

        An other alternative would be to delay to the next loop, but this produce a

        case where another loop is not executed and the conditional not evaluated

        If these kind of usecases pop up before Kconfig migration is completed

        then another alternative would be introduce a variable to require an extra

        loop independent of USEMODULE, FEATURES_REQUIRED and USEPKG'
      include: [$(RIOTMAKE)/features_check.inc.mk]
    - when:
        FEATURES_USED:
          any: [periph_rtt]
      then:
      - add:
          USEMODULE: [ztimer_periph_rtt]
      else:
      - add:
          USEMODULE: [ztimer_periph_timer]
    else:
    - add:
        USEMODULE: [ztimer_periph_timer]
