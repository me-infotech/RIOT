# Build data of sys/ztimer/Makefile.include (steps G3-1, G0-3): the whole
# file. The Make file is generated from it (`just generate-config-data`);
# edit this file, never the Make file. Format: dist/tools/config_data/README.md
schema: 4
rules:
  - comment: |-
      Convert xtimer into a pseudo module if its API is already implemented by
      ztimer's compatibility wrapper
    if: {has: {var: USEMODULE, match: [ztimer_xtimer_compat]}}
    then:
      - add: {PSEUDOMODULES: [xtimer]}
      - if: {not: {has: {var: USEMODULE, match: [ztimer_usec]}}}
        then:
          - info: ${COLOR_YELLOW}WARNING! xtimer_compat without ztimer_usec may be inaccurate${COLOR_RESET}
  - set: {var: MODULES_ZTIMER_ON_RTT_CONFLICT, value: rtt_rtc}
  - comment: |-
      By defaul use highest possible RTT_FREQUENCY for platforms that allow it. This
      might not be the most optimized for conversion guarantees that ztimer_periph_rtt
      will have a capable backend.
    if: {has: {var: USEMODULE, match: [ztimer_periph_rtt]}}
    then:
      - if: {has: {var: CPU, match: [stm32, nrf5%, sam%, kinetis, efm32, fe310]}}
        then:
          - set: {var: RTT_FREQUENCY, value: RTT_MAX_FREQUENCY, flavor: conditional}
          - add: {CFLAGS: ['-DRTT_FREQUENCY=${RTT_FREQUENCY}']}
      - set: {var: MODULES_ZTIMER_ON_RTT_CONFLICTING, value: {select: {var: USEMODULE, match: ['${MODULES_ZTIMER_ON_RTT_CONFLICT}']}}}
      - if: {not: {count: {var: MODULES_ZTIMER_ON_RTT_CONFLICTING, is: 0}}}
        then:
          - info: '${COLOR_YELLOW}WARNING! The following modules conflict with ''ztimer_periph_rtt'': ''${MODULES_ZTIMER_ON_RTT_CONFLICTING}'''
          - info: To disable ztimer periph_rtt auto-inclusion add 'ztimer_no_periph_rtt' to 'USEMODULE'${COLOR_RESET}
