# Build description of the module(s) in sys/shell/cmds. This file is the source: Makefile
# next to it is generated from it (`just generate-config-data`).
# Format: dist/tools/config_data/README.md
schema: 1
rules:
  - set: {var: MODULE, value: shell_cmds}
  - set: {var: BASE_MODULE, value: shell_cmd, flavor: simple}
  - set: {var: SUBMODULES, value: '1', flavor: simple}
  - include: {path: '${RIOTBASE}/Makefile.base'}
