# Build data of sys/net/gnrc/pktbuf_static/Makefile.include (steps G3-1, G0-3): the whole file.
# sys/net/gnrc/pktbuf_static/Makefile.include is generated from it (`just generate-config-data`);
# edit this file, never the Make file. Format: dist/tools/config_data/README.md
schema: 1
rules:
