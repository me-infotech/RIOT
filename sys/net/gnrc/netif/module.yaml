# Build description of the module(s) in sys/net/gnrc/netif. This file is the source: Makefile
# next to it is generated from it (`just generate-config-data`).
# Format: dist/tools/config_data/README.md
schema: 1
rules:
  - set: {var: MODULE, value: gnrc_netif, flavor: simple}
  - if: {has: {var: USEMODULE, match: [gnrc_netif_ethernet]}}
    then:
      - add: {DIRS: [ethernet]}
  - if: {has: {var: USEMODULE, match: [gnrc_netif_ieee802154]}}
    then:
      - add: {DIRS: [ieee802154]}
  - if: {has: {var: USEMODULE, match: [gnrc_netif_init_devs]}}
    then:
      - add: {DIRS: [init_devs]}
  - if: {has: {var: USEMODULE, match: [gnrc_netif_pktq]}}
    then:
      - add: {DIRS: [pktq]}
  - if: {has: {var: USEMODULE, match: [gnrc_netif_hdr]}}
    then:
      - add: {DIRS: [hdr]}
  - if: {has: {var: USEMODULE, match: [gnrc_netif_lorawan]}}
    then:
      - add: {DIRS: [lorawan]}
  - comment: this module is expected to pass static analysis
    set: {var: MODULE_SUPPORTS_STATIC_ANALYSIS, value: '1', flavor: simple}
  - include: {path: '${RIOTBASE}/Makefile.base'}
