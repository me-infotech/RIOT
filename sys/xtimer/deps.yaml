# Dependency rules of sys/xtimer. This file is the source: Makefile.dep
# next to it is generated from it (`just generate-config-data`).
# Format: dist/tools/config_data/README.md
schema: 1
rules:
  - add: {DEFAULT_MODULE: [auto_init_xtimer]}
  - comment: |-
      In whatever combination of backends periph_timer will be required
      - xtimer (only) -> periph_timer
      - xtimer_on_ztimer -> ztimer_usec -> ztimer_periph_timer -> periph_timer
      - ztimer_xtimer_compat -> ztimer_usec -> ztimer_periph_timer -> periph_timer
      But requesting it here avoid an ifeq dependency that would be subject to
      dependency inclusion order issues
    add: {FEATURES_REQUIRED: [periph_timer]}
  - if: {not: {has: {var: USEMODULE, match: [xtimer_no_ztimer_default]}}}
    then:
      - if: {not: {has: {var: USEMODULE, match: [xtimer_on_ztimer]}}}
        then:
          - add: {USEMODULE: [ztimer_xtimer_compat]}
    else:
      - if: {has: {var: USEMODULE, match: [ztimer]}}
        then:
          - if: {not: {has: {var: USEMODULE, match: [xtimer_on_ztimer]}}}
            then:
              - add: {USEMODULE: [ztimer_xtimer_compat]}
  - if: {has: {var: USEMODULE, match: [ztimer_xtimer_compat]}}
    then:
      - add: {DISABLE_MODULE: [auto_init_xtimer]}
      - add: {USEMODULE: [div]}
  - comment: make xtimer use ztimer_usec as low level timer
    if: {has: {var: USEMODULE, match: [xtimer_on_ztimer]}}
    then:
      - add: {USEMODULE: [ztimer_usec]}
