# Dependency rules of sys/test_utils. This file is the source: Makefile.dep
# next to it is generated from it (`just generate-config-data`).
# Format: dist/tools/config_data/README.md
schema: 1
rules:
  - if: {has: {var: USEMODULE, match: [test_utils_result_output]}}
    then:
      - include: {path: '${RIOTBASE}/sys/test_utils/result_output/Makefile.dep'}
  - if: {has: {var: USEMODULE, match: [test_utils_netdev_ieee802154_minimal]}}
    then:
      - include: {path: '${RIOTBASE}/sys/test_utils/netdev_ieee802154_minimal/Makefile.dep'}
  - if: {has: {var: USEMODULE, match: [test_utils_interactive_sync]}}
    then:
      - add: {USEMODULE: [stdin]}
  - if: {has: {var: USEMODULE, match: [benchmark_udp]}}
    then:
      - add: {USEMODULE: [netutils, sema_inv, sock_udp, xtimer]}
  - if: {has: {var: USEMODULE, match: [test_utils_netdev_eth_minimal]}}
    then:
      - include: {path: '${RIOTBASE}/sys/test_utils/netdev_eth_minimal/Makefile.dep'}
