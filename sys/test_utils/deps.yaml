# Dependency rules of sys/test_utils (authoritative; Makefile.dep is generated from this file).
schema_version: 1
rules:
- when:
    USEMODULE:
      any: [test_utils_result_output]
  then:
  - include: [$(RIOTBASE)/sys/test_utils/result_output/Makefile.dep]
- when:
    USEMODULE:
      any: [test_utils_netdev_ieee802154_minimal]
  then:
  - include: [$(RIOTBASE)/sys/test_utils/netdev_ieee802154_minimal/Makefile.dep]
- when:
    USEMODULE:
      any: [test_utils_interactive_sync]
  then:
  - add:
      USEMODULE: [stdin]
- when:
    USEMODULE:
      any: [benchmark_udp]
  then:
  - add:
      USEMODULE: [netutils, sema_inv, sock_udp, xtimer]
- when:
    USEMODULE:
      any: [test_utils_netdev_eth_minimal]
  then:
  - include: [$(RIOTBASE)/sys/test_utils/netdev_eth_minimal/Makefile.dep]
