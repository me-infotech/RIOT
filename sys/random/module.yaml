# Build description of the module(s) in sys/random. This file is the source: Makefile
# next to it is generated from it (`just generate-config-data`).
# Format: dist/tools/config_data/README.md
schema: 1
rules:
  - set: {var: SRC, value: random.c, flavor: simple}
  - set: {var: BASE_MODULE, value: prng, flavor: simple}
  - set: {var: SUBMODULES, value: '1', flavor: simple}
  - if: {has: {var: USEMODULE, match: [prng_fortuna]}}
    then:
      - add: {DIRS: [fortuna]}
  - if: {has: {var: USEMODULE, match: [prng_tinymt32]}}
    then:
      - add: {DIRS: [tinymt32]}
  - include: {path: '${RIOTBASE}/Makefile.base'}
