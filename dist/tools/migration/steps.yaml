#
# Register of the migration steps away from GNU Make.
#
# Single source for: which targets a step migrated, which group they belong
# to, which unit tests check them and what CI must install to run them.
# The workflow .github/workflows/migration-tests.yml builds one CI job per
# step from this file; dist/tools/migration/run_tests.py runs the same tests
# locally. Add a step here, never a test directory to a workflow.
#
# Keys of a step:
#   id        unique, `<roadmap phase>-<topic>` or `g<group>-<NN>-<topic>`
#             (as the branch); the CI job is named after it
#   title     one line
#   group     1 | 2A | 2B | 2C | 3 (taxonomy of the migration concept), or
#             G0 for the foundation (configuration as data, resolver)
#   targets   the migrated targets; each target is in exactly one step;
#             empty (`[]`) for a G0 step, which migrates no Make target
#     name      former Make target
#     now       how it is run after the migration
#     hardware  true if it needs a board; then `board_test` says how it is
#               tested on the board (manually, not in CI)
#   provides  G0 only: the commands the step adds (same keys as a target)
#   tests     directories with unittest modules (test_*.py), relative to the
#             repository root; each is run as its own unittest discovery
#   requires  what CI installs before running the tests
#     pip       Python packages
#     tools     tools installed with taiki-e/install-action (name@version)
#   docs      README that documents the step

steps:
  - id: p3-task-layer-group1
    title: Stateless repository commands from the root Makefile to just
    group: "1"
    targets:
      - name: print-versions
        now: just print-versions
        hardware: false
      - name: generate-features
        now: just generate-features
        hardware: false
    tests:
      - dist/tools/task_layer/tests
      - dist/tools/features_yaml2mx/tests
    requires:
      pip: [pyyaml]
      tools: [just@1.59.0]
    docs: dist/tools/task_layer/README.md

  - id: p3-task-layer-group1-doc
    title: HTML API documentation (doc) from the root Makefile to just
    group: "1"
    targets:
      - name: doc
        now: just doc
        hardware: false
    tests:
      - dist/tools/doccheck/tests
    requires:
      pip: [pyyaml]
      tools: [just@1.59.0]
    docs: dist/tools/task_layer/README.md

  - id: p3-task-layer-group1-list-ttys
    title: list-ttys from Makefile.include (application level) to just
    group: "1"
    targets:
      - name: list-ttys
        now: just list-ttys
        hardware: false
    tests:
      - dist/tools/usb-serial/tests
    requires:
      pip: [pyudev]
      tools: [just@1.59.0]
    docs: dist/tools/task_layer/README.md

  - id: g0-01-config-data
    title: Dependency and feature configuration as YAML data, Make files generated from it
    group: G0
    targets: []
    provides:
      - name: generate-config-data
        now: just generate-config-data
        hardware: false
    tests:
      - dist/tools/config_data/tests
    requires:
      pip: [pyyaml]
      tools: [just@1.59.0]
    docs: dist/tools/config_data/README.md

  - id: g0-02-resolver
    title: Resolver of modules, packages, features and CPU from the configuration data, without Make
    group: G0
    targets: []
    provides:
      - name: resolve
        now: dist/tools/resolver/resolver.py -C <application> BOARD=<board> <info-…|json>
        hardware: false
    tests:
      - dist/tools/resolver/tests
    requires:
      pip: [pyyaml]
    docs: dist/tools/resolver/README.md

  - id: g0-03-build-flags-data
    title: Build data as the only source of the build flags, Make reads adapters generated from it
    group: G0
    targets: []
    provides:
      - name: build-data-adapters
        now: just generate-config-data (writes the build parts of the board, CPU, build system and package Make files from the build data)
        hardware: false
    tests:
      - dist/tools/config_data/build_tests
    requires:
      pip: [pyyaml]
    docs: dist/tools/config_data/README.md

  - id: g3-01-all
    title: Build an application with CMake and Ninja from the data, without Make
    group: "3"
    targets:
      - name: all
        now: just build <application> <board> [VAR=VALUE…]
        hardware: false
    tests:
      - dist/tools/cmake_gen/tests
    requires:
      pip: [pyyaml]
      tools: [just@1.59.0]
    docs: dist/tools/cmake_gen/README.md

  - id: g3-02-flash
    title: Flash an application from the programmer data, without Make
    group: "3"
    targets:
      - name: flash
        now: just flash <application> <board> [PROGRAMMER=…] [VAR=VALUE…]
        hardware: true
        board_test: >-
          nRF52840 DK on USB, J-Link Commander and OpenOCD installed: for
          hello-world, gnrc_networking and bindist run `just flash <app>
          nrf52840dk` with PROGRAMMER=jlink and PROGRAMMER=openocd (and bmp
          with a Black Magic Probe); the flasher must report success and the
          application must answer on the serial port (`make term` until the
          terminal is migrated); compare with `make flash` of the same
          application
    tests:
      - dist/tools/flash/tests
    requires:
      pip: [pyyaml]
      tools: [just@1.59.0]
    docs: dist/tools/flash/README.md
