- sys/test_utils/Makefile.dep
- sys/trickle/Makefile.dep
- sys/xtimer/Makefile.dep
- sys/ztimer/Makefile.dep
# Step G0-2: the rule files of the build system pipeline that hold
# configuration (default modules, stdio backends, features -> modules,
# deprecated modules). Their YAML is `<name>.inc.yaml`; the application
# Makefiles of `applications` are generated from `riot-app.yaml`.
pipeline:
- makefiles/defaultmodules_deps.inc.mk
- makefiles/defaultmodules_no_recursive_deps.inc.mk
- makefiles/defaultmodules_regular.inc.mk
- makefiles/deprecated_modules.inc.mk
- makefiles/features_modules.inc.mk
- makefiles/stdio.inc.mk
# Step G3-1: rule files that module Makefiles include (application module,
# auto_init submodules).
- makefiles/application.inc.mk
- makefiles/auto_init.inc.mk
# Step G3-1 (build without Make): the module Makefiles Make reads when it
# builds the applications above for nrf52840dk (the directories of its
# DIRS recursion and the package module file). Their YAML is
# `module.yaml` (`<x>.module.yaml` for `<x>.mk`); the Makefile is generated.
modules:
- boards/Makefile
- boards/common/init/Makefile
- boards/common/nrf52xxxdk/Makefile
- boards/nrf52840dk/Makefile
- core/Makefile
