# Build data of cpu/cortexm_common/Makefile.include (steps G3-1, G0-3): the
# include path and the linker symbols. The generated build.mk holds it as
# Make; Makefile.include includes it and keeps the riotboot and programmer
# settings (`just generate-config-data`).
# Format: dist/tools/config_data/README.md
schema: 4
rules:
  - comment: include module specific includes
    add: {INCLUDES: ['-I${RIOTCPU}/cortexm_common/include']}
  - comment: |-
      All variables must be defined in the CPU configuration when using the common
      `ldscripts/cortexm.ld`
    if: {nonempty: [ROM_START_ADDR, RAM_START_ADDR, ROM_LEN, RAM_LEN]}
    then:
      - if: {equals: {ROM_START_ADDR: ''}}
        then:
          - error: ROM_START_ADDR is not defined
      - if: {equals: {RAM_START_ADDR: ''}}
        then:
          - error: RAM_START_ADDR is not defined
      - if: {equals: {ROM_LEN: ''}}
        then:
          - error: ROM_LEN is not defined
      - if: {equals: {RAM_LEN: ''}}
        then:
          - error: RAM_LEN is not defined
      - add: {LINKFLAGS: ['${LINKFLAGPREFIX}--defsym=_rom_start_addr=${ROM_START_ADDR}']}
      - add: {LINKFLAGS: ['${LINKFLAGPREFIX}--defsym=_ram_start_addr=${RAM_START_ADDR}']}
      - add: {LINKFLAGS: ['${LINKFLAGPREFIX}--defsym=_rom_length=${ROM_LEN}']}
      - add: {LINKFLAGS: ['${LINKFLAGPREFIX}--defsym=_ram_length=${RAM_LEN}']}
  - if: {nonempty: [BACKUP_RAM_LEN]}
    then:
      - add: {LINKFLAGS: ['${LINKFLAGPREFIX}--defsym=_backup_ram_start_addr=${BACKUP_RAM_ADDR}']}
      - add: {LINKFLAGS: ['${LINKFLAGPREFIX}--defsym=_backup_ram_len=${BACKUP_RAM_LEN}']}
      - add: {CFLAGS: [-DCPU_HAS_BACKUP_RAM=1]}
  - set: {var: TOOLCHAINS_SUPPORTED, value: gnu llvm}
  - comment: |-
      Only define the linker symbol if the variable is set
      The variable can be set using target specific variable thanks to lazy evaluation
  - comment: 'ROM_OFFSET: offset in rom to start linking, allows supporting a bootloader'
    add: {LINKFLAGS: [{when: {test: {var: ROM_OFFSET}, then: '${LINKFLAGPREFIX}--defsym=_rom_offset=${ROM_OFFSET}'}}]}
  - comment: 'FW_ROM_LEN: rom length to use for firmware linking. Allows linking only in a section of the rom.'
    add: {LINKFLAGS: [{when: {test: {var: FW_ROM_LEN}, then: '${LINKFLAGPREFIX}--defsym=_fw_rom_length=${FW_ROM_LEN}'}}]}
