# Dependency rules of cpu/nrf52 (authoritative; Makefile.dep is generated from this file).
schema_version: 1
rules:
- add:
    USEMODULE: [nrf52_vectors]
- when:
    CPU_MODEL:
      any: [nrf52811xxaa, nrf52820xxaa, nrf52833xxaa, nrf52840xxaa]
  then:
  - comment: include dependencies for 802.15.4 radio
    include: [$(RIOTCPU)/nrf52/Makefile.nrf802154.dep]
  else:
  - comment: include dependencies for BLE
    include: [$(RIOTCPU)/nrf52/Makefile.nimble.dep]
- when:
    USEMODULE:
      any: [nrf802154]
  then:
  - add:
      FEATURES_REQUIRED: [periph_timer, radio_nrf802154]
  - add:
      USEMODULE: [luid, ieee802154]
  - when:
      USEMODULE:
        any: [netdev]
    then:
    - add:
        USEMODULE: [netdev_ieee802154_submac]
  - when:
      USEMODULE:
        any: [ieee802154_submac]
    then:
    - add:
        USEMODULE: [ieee802154_submac_soft_ack, ieee802154_submac_soft_csma_ca, ieee802154_submac_soft_frame_retrans]
- when:
    USEMODULE:
      any: [nrfble]
  then:
  - add:
      FEATURES_REQUIRED: [radio_nrfble]
- comment: The nrf52832 requires gpio IRQ with SPI to work around errata 58
  when:
    CPU_MODEL:
      any: [nrf52832xxaa]
  then:
  - when:
      USEMODULE:
        any: [periph_spi]
    then:
    - add:
        FEATURES_REQUIRED: [periph_gpio_irq]
- when:
    USEMODULE:
      any: [periph_uart_nonblocking]
  then:
  - add:
      USEMODULE: [tsrb]
- when:
    USEMODULE:
      any: [saul_nrf_vddh]
  then:
  - add:
      FEATURES_REQUIRED: [periph_adc]
- when:
    USEMODULE:
      any: [periph_spi]
  then:
  - add:
      USEMODULE: [periph_spi_gpio_mode]
- include: [$(RIOTCPU)/nrf52/periph/Makefile.dep]
- include: [$(RIOTCPU)/nrf5x_common/Makefile.dep]
- include: [$(RIOTCPU)/cortexm_common/Makefile.dep]
