# Flash data of cpu/nrf52/Makefile.include (step G3-2). Source of
# flash.inc.mk next to it (`just generate-flash-data`), which the Make file
# includes first. Format: dist/tools/flash/README.md.
schema: 3
rules:
  - comment: |-
      Set the target for the JLink programmer for flashing, JLINK expects an
      underscore in the target, like "nrf52832_xxaa".
      Boards that do not use a JLink ignore the flag.
    set: {var: JLINK_DEVICE, value: {select: {var: CPU_MODEL, replace: {from: xx, to: _xx}}}}
