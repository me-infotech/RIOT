# Build data of cpu/nrf52/Makefile.include (step G3-1): memory sizes and the
# includes; the bootloader, MCUboot, J-Link and SVD settings of the Make file
# belong to flashing and debugging.
# Format: dist/tools/config_data/README.md (schema 3).
schema: 3
rules:
  - if: {has: {var: CPU_MODEL, match: [nrf52805xxaa, nrf52810xxaa, nrf52811xxaa]}}
    then:
      - set: {var: ROM_LEN, value: '0x30000', flavor: conditional}
      - set: {var: RAM_LEN, value: '0x6000', flavor: conditional}
  - if: {has: {var: CPU_MODEL, match: [nrf52820xxaa]}}
    then:
      - set: {var: ROM_LEN, value: '0x40000', flavor: conditional}
      - set: {var: RAM_LEN, value: '0x8000', flavor: conditional}
  - if: {has: {var: CPU_MODEL, match: [nrf52832xxaa]}}
    then:
      - set: {var: ROM_LEN, value: '0x80000', flavor: conditional}
      - set: {var: RAM_LEN, value: '0x10000', flavor: conditional}
  - if: {has: {var: CPU_MODEL, match: [nrf52833xxaa]}}
    then:
      - set: {var: ROM_LEN, value: '0x80000', flavor: conditional}
      - set: {var: RAM_LEN, value: '0x20000', flavor: conditional}
  - if: {has: {var: CPU_MODEL, match: [nrf52840xxaa]}}
    then:
      - set: {var: ROM_LEN, value: '0x100000', flavor: conditional}
      - set: {var: RAM_LEN, value: '0x40000', flavor: conditional}
  - include: {path: '${RIOTCPU}/nrf5x_common/Makefile.include'}
  - include: {path: '${RIOTMAKE}/arch/cortexm.inc.mk'}
