name: migration-tests

# Unit tests of the migration away from GNU Make.
# One job per migration step, generated from dist/tools/migration/steps.yaml.
# To add tests for a migrated target, register its step there; do not list
# test directories in this file.

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - '*'
  merge_group:

jobs:
  register:
    name: register (steps.yaml)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
    - uses: actions/checkout@main
    - uses: actions/setup-python@v7
      with:
        python-version: 3.14
    - name: Install dependencies
      run: python -m pip install pyyaml
    - name: Install just
      uses: taiki-e/install-action@v2
      with:
        tool: just@1.59.0
    - name: Check register and workflow organisation
      run: python -m unittest discover -s dist/tools/migration/tests -v
    - name: Build job matrix
      id: matrix
      run: echo "matrix=$(python dist/tools/migration/run_tests.py --matrix)" >> "$GITHUB_OUTPUT"

  step:
    name: ${{ matrix.id }} (group ${{ matrix.group }})
    needs: register
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.register.outputs.matrix) }}
    steps:
    - uses: actions/checkout@main
    - uses: actions/setup-python@v7
      with:
        python-version: 3.14
    - name: Install Python packages
      run: python -m pip install pyyaml ${{ matrix.pip }}
    - name: Install tools
      if: matrix.tools != ''
      uses: taiki-e/install-action@v2
      with:
        tool: ${{ matrix.tools }}
    - name: Run unit tests
      run: python dist/tools/migration/run_tests.py --step ${{ matrix.id }} --verbose
