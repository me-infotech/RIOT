name: Guide Build Test

on:
  pull_request:
    paths:
      - 'doc/guides/**'
      - 'doc/starlight/**'
      - 'justfile'
      - 'just/**'
      - 'CODE_OF_CONDUCT.md'
      - 'GOVERNANCE.md'
      - 'CONTRIBUTING.md'
      - 'CODING_CONVENTIONS*.md'
      - 'release-notes.txt'

jobs:
  build-guide:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: doc/starlight
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
            node-version: '25.x'
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0
      - name: Build documentation
        run: just starlight-build
