# Build data of boards/Makefile.include (steps G3-1, G0-3): the whole file.
# boards/Makefile.include is generated from it (`just generate-config-data`);
# edit this file, never the Make file. Format: dist/tools/config_data/README.md
schema: 1
rules:
  - comment: SORT THIS ALPHABETICALLY BY COMMON BOARD NAME!
    if: {has: {var: USEMODULE, match: [boards_common_adafruit-nrf52-bootloader]}}
    then:
      - include: {path: '${RIOTBOARD}/common/adafruit-nrf52-bootloader/Makefile.include'}
  - if: {has: {var: USEMODULE, match: [boards_common_esp32]}}
    then:
      - include: {path: '${RIOTBOARD}/common/esp32/Makefile.include'}
  - if: {has: {var: USEMODULE, match: [boards_common_esp32c3]}}
    then:
      - include: {path: '${RIOTBOARD}/common/esp32c3/Makefile.include'}
  - if: {has: {var: USEMODULE, match: [boards_common_esp32c6]}}
    then:
      - include: {path: '${RIOTBOARD}/common/esp32c6/Makefile.include'}
  - if: {has: {var: USEMODULE, match: [boards_common_esp32h2]}}
    then:
      - include: {path: '${RIOTBOARD}/common/esp32h2/Makefile.include'}
  - if: {has: {var: USEMODULE, match: [boards_common_esp32s2]}}
    then:
      - include: {path: '${RIOTBOARD}/common/esp32s2/Makefile.include'}
  - if: {has: {var: USEMODULE, match: [boards_common_esp32s3]}}
    then:
      - include: {path: '${RIOTBOARD}/common/esp32s3/Makefile.include'}
  - if: {has: {var: USEMODULE, match: [boards_common_esp32x]}}
    then:
      - include: {path: '${RIOTBOARD}/common/esp32x/Makefile.include'}
  - if: {has: {var: USEMODULE, match: [boards_common_rpi_pico_2]}}
    then:
      - include: {path: '${RIOTBOARD}/common/rpi-pico-2/Makefile.include'}
  - if: {has: {var: USEMODULE, match: [boards_common_seeedstudio-xiao-nrf52840]}}
    then:
      - include: {path: '${RIOTBOARD}/common/seeedstudio-xiao-nrf52840/Makefile.include'}
