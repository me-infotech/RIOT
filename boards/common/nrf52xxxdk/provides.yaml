# Provided features and CPU data of boards/common/nrf52xxxdk. This file is the source: Makefile.features
# next to it is generated from it (`just generate-config-data`).
# Format: dist/tools/config_data/README.md
schema: 1
rules:
  - comment: Put defined MCU peripherals here (in alphabetical order)
    add: {FEATURES_PROVIDED: [periph_i2c]}
  - add: {FEATURES_PROVIDED: [periph_pwm, periph_spi, periph_uart, vdd_lc_filter_reg1]}
  - include: {path: '${RIOTBOARD}/common/nrf52/Makefile.features'}
