# Build data of boards/common/nrf52xxxdk/Makefile.include (steps G3-1, G0-3): the whole file.
# boards/common/nrf52xxxdk/Makefile.include is generated from it (`just generate-config-data`);
# edit this file, never the Make file. Format: dist/tools/config_data/README.md
schema: 1
rules:
  - comment: include this module into the build
    add: {INCLUDES: ['-I${RIOTBOARD}/common/nrf52xxxdk/include']}
  - comment: include common configuration for nrf52 based boards
    include: {path: '${RIOTBOARD}/common/nrf52/Makefile.include'}
