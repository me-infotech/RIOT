# Terminal data of boards/common/nrf52/Makefile.include (step G2B-1): the
# serial port of the Black Magic Probe. Source of term.inc.mk next to it
# (`just generate-term-data`), which the Make file includes after its flash
# adapter. Format: dist/tools/term/README.md.
schema: 4
rules:
  - comment: |-
      On Blackmagic Probe, the first ACM is used to connect to the gdb server,
      the second is the BMP's UART interface
    if: {equals: {PROGRAMMER: bmp}}
    then:
      - set: {var: PORT_LINUX, value: /dev/ttyACM1, flavor: conditional}
      - set: {var: PORT_DARWIN, value: {word: {var: PROBE_TTY_USBMODEM, index: 2}}, flavor: conditional}
