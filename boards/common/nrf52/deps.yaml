# Dependency rules of boards/common/nrf52 (authoritative; Makefile.dep is generated from this file).
schema_version: 1
rules:
- when:
    USEMODULE:
      any: [saul_default]
  then:
  - add:
      USEMODULE: [saul_nrf_temperature]
- when:
    USEMODULE:
      any: [boards_common_adafruit-nrf52-bootloader]
  then:
  - comment: 'If this only gets included in the 2nd round of dependency resolution

      we will already have included stdio_uart by default.

      Include this here to select stdio_cdc_acm early.'
    include: [$(RIOTBOARD)/common/adafruit-nrf52-bootloader/Makefile.dep]
