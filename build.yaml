# Build data of Makefile.include (steps G3-1, G0-3): what the build of an
# application reads from the build system's main Make file, in Make's order.
# The generated build.mk holds it as Make, in sections; Makefile.include
# includes each section where its rules were and keeps the parts that are
# not data (flashing, terminal, debugging, Docker, Kconfig, the resolution
# of modules and features - done by the resolver of step G0-2 for the build
# without Make - and the build rules). The values the data reads but does
# not define (PROBE_*, BUILD_RIOT_VERSION_TUPLE, BUILD_EXTDEFINES) come from
# the build algorithm (dist/tools/cmake_gen; for Make
# makefiles/build_providers.inc.mk).
# Format: dist/tools/config_data/README.md
schema: 4
rules:
  - section: flags
  - set: {var: RIOTBUILD_CONFIG_HEADER_C, value: '${BINDIR}/riotbuild/riotbuild.h', export: true}
  - comment: QUIET is set by the application
    set: {var: QUIET, value: '1', flavor: conditional}
  - comment: |-
      Set this to 1 to enable pretty-printing the assert location in addition
      to the address of the failing assert.
      This saves you to resolve the address manually with addr2line at the cost
      of greater ROM consumption.
    set: {var: VERBOSE_ASSERT, value: '0', flavor: conditional}
  - if: {equals: {VERBOSE_ASSERT: '1'}}
    then:
      - add: {CFLAGS: [-DDEBUG_ASSERT_VERBOSE]}
      - set: {var: DEVELHELP, value: '1', flavor: simple}
  - comment: |-
      Set this to 1 to enable code in RIOT that does safety checking
      which is not needed in a production environment but helps in the
      development process:
    set: {var: DEVELHELP, value: '0', flavor: conditional}
  - if: {equals: {DEVELHELP: '1'}}
    then:
      - add: {CFLAGS: [-DDEVELHELP]}
  - comment: Set this to 1 to enable thread names
    set: {var: THREAD_NAMES, value: '0', flavor: conditional}
  - if: {equals: {THREAD_NAMES: '1'}}
    then:
      - add: {CFLAGS: [-DCONFIG_THREAD_NAMES]}
  - comment: |-
      Override LOG_LEVEL if variable is set and if CFLAGS doesn't already contain
      a LOG_LEVEL config
    if: {defined: LOG_LEVEL}
    then:
      - if: {not: {has: {var: CFLAGS, match: [-DLOG_LEVEL=%]}}}
        then:
          - add: {CFLAGS: ['-DLOG_LEVEL=${LOG_LEVEL}']}
  - comment: Fail on warnings. Can be overridden by `make WERROR=0`.
    set: {var: WERROR, value: '1', flavor: conditional}
  - if: {equals: {WERROR: '1'}}
    then:
      - add: {CFLAGS: [-Werror]}
  - set: {var: WPEDANTIC, value: '0', flavor: conditional}
  - if: {equals: {WPEDANTIC: '1'}}
    then:
      - add: {CFLAGS: [-Wpedantic]}
  - comment: Provide a shallow sanity check. You cannot call `make` in a module directory.
    set: {var: __RIOTBUILD_FLAG, value: RIOT, flavor: simple, export: true}
  - comment: |-
      Tool saving stdin to a file only on content update.
      It keeps the file timestamp if it would end up the same.
    set: {var: LAZYSPONGE, value: '${RIOTTOOLS}/lazysponge/lazysponge.py', flavor: conditional}
  - set: {var: LAZYSPONGE_FLAGS, value: {when: {test: {var: QUIET, match: ['1']}, else: --verbose}}, flavor: conditional}
  - comment: |-
      default toolchain prefix, defaults to target triple followed by a dash, you
      will most likely not need to touch this.
    set: {var: PREFIX, value: {when: {test: {var: TARGET_ARCH}, then: '${TARGET_ARCH}-'}}, flavor: conditional, export: true}
  - comment: Add standard include directories
    add: {INCLUDES: ['-I${APPDIR}']}
  - set: {var: BUILD_APP_INCLUDE_DIR, value: {files: {match: ['${APPDIR}/include']}}}
  - add: {INCLUDES: [{select: {var: BUILD_APP_INCLUDE_DIR, pattern: {from: '%', to: '-I%'}}}]}
  - add: {INCLUDES: ['-I${RIOTBASE}/core/lib/include', '-I${RIOTBASE}/core/include', '-I${RIOTBASE}/drivers/include', '-I${RIOTBASE}/sys/include']}
  - section: board
    comment: Include Board and CPU configuration
  - set: {var: BUILD_BOARD_INCLUDE_DIR, value: {files: {match: ['${BOARDDIR}/include']}}}
  - add: {INCLUDES: [{select: {var: BUILD_BOARD_INCLUDE_DIR, pattern: {from: '%', to: '-I%'}}}]}
  - add: {INCLUDES: ['-I${RIOTCPU}/${CPU}/include']}
  - comment: |-
      Include the Makefile.include for common boards after the specific board,
      likewise proceed with the CPU Makefile.includes.
    include: {path: '${BOARDDIR}/Makefile.include'}
  - include: {path: '${RIOTBASE}/boards/Makefile.include'}
  - include: {path: '${RIOTCPU}/Makefile.include'}
  - include: {path: '${RIOTCPU}/${CPU}/Makefile.include'}
  - section: toolchain
  - comment: |-
      Assume GCC/GNU as supported toolchain if CPU's Makefile.include doesn't
      provide this macro
    set: {var: TOOLCHAINS_SUPPORTED, value: gnu, flavor: conditional}
  - comment: Import all toolchain settings
    include: {path: '${RIOTMAKE}/toolchain/${TOOLCHAIN}.inc.mk'}
  - comment: |-
      Other than on native, RWX segments in ROM are not actually RWX, as regular
      store instructions won't write to flash.
    if: {not: {has: {var: BOARD, match: [native, native32, native64]}}}
    then:
      - set: {var: LINKER_SUPPORTS_NOWARNRWX, value: '${PROBE_LINK_NOWARNRWX}', flavor: conditional}
      - if: {equals: {LINKER_SUPPORTS_NOWARNRWX: '1'}}
        then:
          - add: {LINKFLAGS: ['-Wl,--no-warn-rwx-segments']}
  - comment: |-
      Append ldscript path after importing CPU and board makefiles to allow
      overriding the core ldscripts
    add: {LINKFLAGS: ['-L${RIOTBASE}/core/ldscripts']}
  - section: version
  - comment: |-
      Tell ccache to pass the original file to the compiler, instead of passing the
      preprocessed code. Without this setting, the compilation will fail with
      -Wimplicit-fallthrough warnings even when the fall through case is properly
      commented because the preprocessor has stripped the comments from the code.
      This also fixes some other false warnings when compiling with LLVM/Clang.
      The environment variable only affects builds with ccache (e.g. on CI/Murdock).
      Non cached builds are not affected in any way.
      For more information, see http://petereisentraut.blogspot.com/2011/09/ccache-and-clang-part-2.html
    set: {var: CCACHE_CPP2, value: 'yes', export: true}
  - comment: set some settings useful for continuous integration builds
    if: {equals: {RIOT_CI_BUILD: '1'}}
    then:
      - set: {var: RIOT_VERSION, value: buildtest, flavor: conditional}
  - comment: 'if you want to publish the board into the sources as an uppercase #define'
    set: {var: BOARDDEF, value: {select: {var: BOARD, macro: true}}}
  - set: {var: CPUDEF, value: {select: {var: CPU, macro: true}}}
  - add: {CFLAGS: ['-DRIOT_APPLICATION=\"${APPLICATION}\"']}
  - add: {CFLAGS: ['-DBOARD_${BOARDDEF}=\"${BOARD}\"', '-DRIOT_BOARD=BOARD_${BOARDDEF}']}
  - add: {CFLAGS: ['-DCPU_${CPUDEF}=\"${CPU}\"', '-DRIOT_CPU=CPU_${CPUDEF}']}
  - comment: Feature test default CFLAGS and LINKFLAGS for the set compiled.
    include: {path: '${RIOTMAKE}/cflags.inc.mk'}
  - comment: Include VERSION for releases (not data, outside the build data if present)
    include: {path: '${RIOTBASE}/VERSION', optional: true}
  - include: {path: '${RIOTBASE}/EXTRAVERSION', optional: true}
  - include: {path: '${RIOTMAKE}/git_version.inc.mk'}
  - set: {var: RIOT_VERSION, value: '${RIOT_VERSION_GIT}', flavor: conditional}
  - set: {var: RIOT_DUMMY_VERSION, value: 2042.5.23, flavor: conditional}
  - set: {var: RIOT_EXTRAVERSION, value: '0', flavor: conditional}
  - comment: |-
      Generate machine readable RIOT_VERSION macro. This will fall-back to
      RIOT_DUMMY_VERSION if RIOT_VERSION is invalid (e.g. during CI builds).
      BUILD_RIOT_VERSION_TUPLE: `version_tuple` of RIOT_VERSION, else of
      RIOT_DUMMY_VERSION (build algorithm).
    set: {var: RIOT_VERSION_CODE, value: 'RIOT_VERSION_NUM\(${BUILD_RIOT_VERSION_TUPLE},${RIOT_EXTRAVERSION}\)', flavor: conditional}
  - comment: add extra include paths for packages in $(USEMODULE)
    set: {var: USEMODULE_INCLUDES, value: ''}
  - comment: include global Makefile.include for `sys` modules
    include: {path: '${RIOTBASE}/sys/Makefile.include'}
  - comment: include Makefile.includes of each driver modules if they exist
    include: {for_each: USEMODULE, path: '${RIOTBASE}/drivers/%/Makefile.include', optional: true}
  - comment: include Makefile.includes for packages in $(PKG_PATHS)
    include: {for_each: PKG_PATHS, path: '%Makefile.include', optional: true}
  - comment: include external modules configuration
    include: {for_each: EXTERNAL_MODULE_PATHS, path: '%Makefile.include', optional: true}
  - comment: Deduplicate includes without sorting them (`uniq`, defined in Makefile.include)
    add: {INCLUDES: [{select: {var: USEMODULE_INCLUDES, unique: true, pattern: {from: '%', to: '-I%'}}}]}
  - comment: include bindist target
    include: {path: '${RIOTMAKE}/bindist.inc.mk'}
  - section: files
  - set: {var: ELFFILE, value: '${BINDIR}/${APPLICATION}.elf', flavor: conditional}
  - set: {var: HEXFILE, value: {select: {var: ELFFILE, pattern: {from: '%.elf', to: '%.hex'}}}, flavor: conditional}
  - set: {var: BINFILE, value: {select: {var: ELFFILE, pattern: {from: '%.elf', to: '%.bin'}}}, flavor: conditional}
  - set: {var: HASHFILE, value: '${BINFILE}', flavor: conditional}
  - set: {var: MAPFILE, value: {select: {var: ELFFILE, pattern: {from: '%.elf', to: '%.map'}}}, flavor: conditional}
  - section: link
  - comment: |-
      The programmer's Make file (makefiles/tools/openocd.inc.mk,
      jlink.inc.mk) sets FLASHFILE ?= $(ELFFILE) for the boards in scope;
      flashing is migrated in step G3-2.
    set: {var: FLASHFILE, value: '${ELFFILE}', flavor: conditional}
    stand_in: makefiles/tools/openocd.inc.mk
  - add: {BUILD_FILES: ['${ELFFILE}', '${BINFILE}', '${FLASHFILE}', '${HASHFILE}']}
  - comment: variables used to compile and link c++
    if: {has: {var: USEMODULE, match: [cpp]}}
    then:
      - set: {var: CPPMIX, value: '1', flavor: conditional}
  - comment: 'We assume $(LINK) to be gcc-like. Use `LINKFLAGPREFIX :=` for ld-like linker options.'
    set: {var: LINKFLAGPREFIX, value: '-Wl,', flavor: conditional}
  - comment: Also build external modules
    add: {DIRS: ['${EXTERNAL_MODULE_PATHS}']}
  - comment: GENSRC (generated sources of packages) is made accessible to subprocesses
    export: [GENSRC]
  - section: vars
  - comment: 'Export variables used throughout the whole make system:'
    include: {path: '${RIOTMAKE}/vars.inc.mk'}
  - section: header
  - comment: |-
      The configuration header riotbuild.h (rules in Makefile.include):
      BUILD_EXTDEFINES are the MODULE_* defines of makefiles/modules.inc.mk
      (build algorithm).
    add: {CFLAGS_WITH_MACROS: ['${CFLAGS}']}
  - add: {CFLAGS_WITH_MACROS: ['-DRIOT_VERSION=\"${RIOT_VERSION}\"']}
  - add: {CFLAGS_WITH_MACROS: ['-DRIOT_VERSION_CODE=${RIOT_VERSION_CODE}']}
  - comment: 'To allow package code easily check if compiled against RIOT or not:'
    add: {CFLAGS_WITH_MACROS: [-DRIOT_OS=1]}
  - if: {nonempty: [RIOT_VERSION_EXTRA]}
    then:
      - add: {CFLAGS_WITH_MACROS: ['-DCONFIG_RIOT_VERSION_EXTRA=\""${RIOT_VERSION_EXTRA}"\"']}
  - comment: MODULE_NAME defines. Declared in 'makefiles/modules.inc.mk'
    add: {CFLAGS_WITH_MACROS: ['${BUILD_EXTDEFINES}']}
  - add: {CFLAGS: ['-include', '''${RIOTBUILD_CONFIG_HEADER_C}''']}
